<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>어댑터 인스타 홍보 이미지</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Pretendard', '-apple-system', 'sans-serif'],
                    },
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' },
                        kakao: '#FEE500'
                    }
                }
            }
        }
    </script>
    
    <!-- Fonts -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { 
            background-color: #0f172a; 
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        /* 인스타그램 1:1 정방형 사이즈 (1080x1080) */
        .insta-canvas {
            width: 1080px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            background-color: #020617; /* slate-950 */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform-origin: center;
        }
        /* 화면 크기에 맞춰 스케일 축소 (보기 편하게) */
        @media (max-width: 1200px) {
            .insta-canvas { transform: scale(0.8); }
        }
        @media (max-width: 900px) {
            .insta-canvas { transform: scale(0.6); }
        }
        @media (max-width: 600px) {
            .insta-canvas { transform: scale(0.35); }
        }
        
        .glass-card { 
            background: rgba(30, 41, 59, 0.6); 
            backdrop-filter: blur(24px); 
            border: 2px solid rgba(255, 255, 255, 0.1); 
        }
    </style>
</head>
<body>

    <!-- 캡처를 위한 1080x1080 캔버스 영역 -->
    <div class="insta-canvas flex flex-col justify-between p-24 relative">
        <!-- 배경 효과 -->
        <div class="absolute top-[-200px] right-[-200px] w-[800px] h-[800px] bg-brand-600/30 blur-[200px] rounded-full"></div>
        <div class="absolute bottom-[-200px] left-[-200px] w-[800px] h-[800px] bg-purple-600/20 blur-[200px] rounded-full"></div>

        <!-- 로고 -->
        <div class="relative z-10 flex items-center justify-between w-full">
            <h1 class="text-5xl font-black tracking-tighter text-brand-500">adopter</h1>
            <div class="glass-card px-6 py-3 rounded-full flex items-center gap-3">
                <div class="w-4 h-4 rounded-full bg-red-500 animate-pulse"></div>
                <span class="text-white font-bold text-2xl tracking-widest">EVENT</span>
            </div>
        </div>

        <!-- 메인 콘텐츠 -->
        <div class="relative z-10 flex flex-col items-center text-center mt-12">
            <p class="text-brand-400 text-3xl font-black mb-8 tracking-widest uppercase bg-brand-500/10 px-8 py-3 rounded-full border border-brand-500/30">
                어댑터 런칭 기념 특별 프로모션
            </p>
            
            <h2 class="text-white text-[100px] leading-[1.1] font-black mb-6 tracking-tight">
                무료 <span class="text-brand-500 underline decoration-slate-800 underline-offset-[20px]">홈페이지</span><br/>
                제작 지원
            </h2>
            
            <p class="text-slate-400 text-3xl font-medium mt-6 leading-relaxed">
                사장님은 사업에만 집중하세요.<br/>
                디자인부터 검색 포털 노출까지 모두 세팅해 드립니다!
            </p>
        </div>

        <!-- 하단 강조 영역 -->
        <div class="relative z-10 flex flex-col items-center mt-16">
            <!-- 한정 혜택 박스 -->
            <div class="bg-gradient-to-r from-red-500 to-orange-500 p-[3px] rounded-[3rem] shadow-2xl shadow-red-500/20 mb-12 transform hover:scale-105 transition-transform w-full max-w-4xl">
                <div class="bg-slate-900 rounded-[2.8rem] py-10 px-12 flex items-center justify-center gap-8">
                    <i data-lucide="gift" class="text-red-500" style="width: 64px; height: 64px;"></i>
                    <div class="text-left">
                        <p class="text-slate-400 text-2xl font-bold mb-2">신청자 대상 특별 혜택</p>
                        <p class="text-white text-5xl font-black tracking-tight">선착순 <span class="text-red-500 text-6xl">5명 한정</span> 추첨!</p>
                    </div>
                </div>
            </div>

            <!-- 콜투액션 (카카오톡) -->
            <div class="flex items-center gap-6 bg-[#FEE500] text-black px-12 py-6 rounded-full font-black text-4xl shadow-xl hover:bg-[#FEE500]/90 transition-colors cursor-pointer">
                <svg viewBox="0 0 24 24" class="w-12 h-12 fill-current">
                    <path d="M12 3c-5.52 0-10 3.58-10 8 0 2.87 1.94 5.38 4.88 6.74-.2 1.48-.68 3.52-.72 3.82-.04.3.16.2.32.1.18-.1 2.38-1.5 4.38-2.92.36.06.74.1 1.14.1 5.52 0 10-3.58 10-8s-4.48-8-10-8z"/>
                </svg>
                카카오톡으로 빠른 문의주세요!
            </div>
            <p class="text-slate-500 text-xl font-bold mt-8 tracking-widest">프로필 링크를 클릭하여 상담을 신청하세요</p>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
