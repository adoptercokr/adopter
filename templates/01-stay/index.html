        strip.innerHTML = '';
        ALL_PHOTOS.forEach((p, i) => {

      if (curMobEl) curMobEl.innerText = selectedText;
      if (curDeskEl) curDeskEl.innerText = selectedText;

      // 援ш? 踰덉뿭 荑좏궎 ?ㅼ젙 諛??ㅽ뻾
      document.cookie = `googtrans=/ko/${langCode}; path=/;`;
      document.cookie = `googtrans=/ko/${langCode}; path=/; domain=${window.location.hostname}`;
      
      const select = document.querySelector('.goog-te-combo');
      if (select) {
        select.value = langCode;
        select.dispatchEvent(new Event('change'));
      } else {
        location.reload();
      }
    }

    // ?몄뼱 ?곹깭 珥덇린??諛?/ko/ko ?ㅼ뿼 諛⑹?
    function initLanguageState() {
      const match = document.cookie.match(/(?:^|;\s*)googtrans=([^;]*)/);
      if (match) {
        const val = decodeURIComponent(match[1]);
        const targetLang = val.split('/')[2];
        if (targetLang === 'ko') {
          // /ko/ko 荑좏궎媛 ?⑥븘?덉쑝硫??곷Ц??媛뺤젣 ?쒓??붾릺誘濡?源⑤걮???쒓굅
          document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
          document.cookie = `googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=${window.location.hostname}`;
        } else if (targetLang && targetLang !== 'ko') {
          const langMap = { 'ko': 'KR', 'en': 'EN', 'zh-CN': '訝?뻼', 'ja': '?ζ쑍沃? };
          const curText = langMap[targetLang] || 'KR';
          const curMobEl = document.getElementById('currentMobileLangText');
          const curDeskEl = document.getElementById('currentDesktopLangText');
          if (curMobEl) curMobEl.innerText = curText;
          if (curDeskEl) curDeskEl.innerText = curText;
        }
      }
    }

    // 珥덇린 ?ㅽ뻾
    initLanguageState();
    renderCalendar();
    fetchBookingsFromCloud(); // ?대씪?곕뱶 ?ㅼ떆媛??덉빟 ?곗씠???먮룞 ?숆린??
  </script>

  <!-- Google Translate Hidden Element & Loader -->
  <div id="google_translate_element" style="display:none;"></div>
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'ko',
        includedLanguages: 'ko,en,zh-CN,ja',
        autoDisplay: false
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
