                    if (firstChild) {
                        const style = window.getComputedStyle(el);
                        const gap = parseInt(style.gap) || 0;
                        // Calculate exact width to scroll one item at a time
                        const scrollAmt = (firstChild.offsetWidth + gap) * direction;
                        
                        if (direction === 1 && (el.scrollLeft + el.clientWidth >= el.scrollWidth - 15)) {
                            el.scrollTo({ left: 0, behavior: 'smooth' });
                        } else if (direction === -1 && el.scrollLeft <= 5) {
