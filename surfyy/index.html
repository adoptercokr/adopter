<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>양양 서피 스테이 | 럭셔리 프라이빗 스테이</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        black: '#0f0f0f',
                        white: '#f5f5f5',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f5f5f5; color: #0f0f0f; overflow-x: hidden; font-feature-settings: "liga" 1, "kern" 1; -webkit-font-smoothing: antialiased; }
        .hero-text { font-size: clamp(5rem, 15vw, 15rem); line-height: 0.8; letter-spacing: -0.04em; }
        .split-text { overflow: hidden; display: block; }
        .split-text span { display: block; transform: translateY(100%); }
        .img-reveal { clip-path: inset(100% 0 0 0); }
        .overlap-title { margin-left: -5vw; mix-blend-mode: exclusion; color: white; z-index: 10; position: relative; }
    </style>
<style>
#roomTab2, #roomTab3, #priceTab2, #priceTab3 { display: none !important; }
</style>
</head>
<body class="antialiased font-sans cursor-default">
    <div class="fixed top-0 left-0 w-full p-8 flex justify-between items-start z-50 mix-blend-difference text-white pointer-events-none">
        <div class="font-serif text-3xl md:text-4xl font-bold tracking-tighter">BY THE SEA</div>
        <div class="text-xs md:text-sm uppercase tracking-widest flex flex-col items-end gap-2 pointer-events-auto cursor-pointer hover:opacity-50 transition-opacity">
            <span>Menu</span>
            <span>Est. 2024</span>
        </div>
    </div>
    
    <header class="relative w-full h-[120vh] flex flex-col justify-center">
        <div class="absolute top-0 right-0 w-[85%] md:w-[70%] h-[90vh] img-container">
            <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&q=80&w=1920" alt="Ocean View" class="w-full h-full object-cover filter grayscale contrast-125 img-reveal" id="hero-img" />
        </div>
        <div class="z-10 relative px-8 md:px-24 mt-32 md:mt-0">
            <h1 class="hero-text font-serif font-bold uppercase">
                <span class="split-text"><span class="reveal-text">Ocean</span></span>
                <span class="split-text"><span class="italic ml-12 md:ml-48 reveal-text">Retreat</span></span>
            </h1>
            <p class="mt-12 md:mt-24 max-w-sm text-lg font-light leading-relaxed">
                특별한 경험 unparalleled luxury where the horizon meets architectural brilliance. A stark, asymmetric masterpiece.
            </p>
        </div>
    </header>

    <section class="py-32 md:py-48 px-8 md:px-24">
        <div class="flex flex-col md:flex-row justify-between items-end gap-16 md:gap-32">
            <div class="w-full md:w-5/12 order-2 md:order-1 relative">
                <div class="overflow-hidden">
                    <img src="https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&q=80&w=1920" alt="Interior" class="w-full h-auto filter grayscale contrast-125 scroll-img" />
                </div>
                <div class="absolute -bottom-24 -right-12 md:-right-24 w-3/4 md:w-2/3 z-20 overflow-hidden">
                    <img src="https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?auto=format&fit=crop&q=80&w=1920" alt="Details" class="w-full h-auto filter grayscale contrast-125 scroll-img delay-100" />
                </div>
            </div>
            <div class="w-full md:w-6/12 order-1 md:order-2">
                <h2 class="font-serif text-6xl md:text-[8rem] leading-[0.8] mb-12 overlap-title uppercase tracking-tighter">Curated<br><span class="italic">Spaces</span></h2>
                <div class="pl-0 md:pl-24">
                    <p class="text-xl md:text-2xl font-light leading-relaxed max-w-lg mb-12">
                        Every corner is meticulously designed to create harmony between stark modernism and the raw power of nature.
                    </p>
                    <a href="#" class="inline-block border-b border-black pb-2 text-sm uppercase tracking-widest hover:text-gray-500 w-max transition-colors">View 갤러리</a>
                </div>
            </div>
        </div>
    </section>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        // Hero Animations
        const tl = gsap.timeline();
        
        tl.to("#hero-img", {
            clipPath: "inset(0% 0% 0% 0%)",
            duration: 1.5,
            ease: "power4.inOut"
        })
        .to(".reveal-text", {
            y: "0%",
            duration: 1.2,
            ease: "power4.out",
            stagger: 0.1
        }, "-=1")
        .from("header p", {
            opacity: 0,
            y: 20,
            duration: 1,
            ease: "power3.out"
        }, "-=0.8");

        // Scroll Animations
        gsap.utils.toArray('.scroll-img').forEach(img => {
            gsap.fromTo(img, 
                { clipPath: "inset(10% 10% 10% 10%)", scale: 1.1 },
                {
                    clipPath: "inset(0% 0% 0% 0%)",
                    scale: 1,
                    duration: 1.5,
                    ease: "power3.out",
                    scrollTrigger: {
                        trigger: img,
                        start: "top 80%",
                        end: "bottom 20%",
                        scrub: 1
                    }
                }
            );
        });

        // Parallax Effect
        gsap.to(".img-container", {
            yPercent: 20,
            ease: "none",
            scrollTrigger: {
                trigger: "header",
                start: "top top",
                end: "bottom top",
                scrub: true
            }
        });
    </script>
</body>
</html>
