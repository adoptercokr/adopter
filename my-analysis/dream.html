function interpretDream() {
    const category = document.getElementById('dream-category').value;
    const type = document.getElementById('dream-type').value;
    const detail = document.getElementById('dream-detail').value;

    if(detail.length < 2) {
        alert("꿈의 내용을 조금 더 자세히 적어주세요! ✨");
        return;
    }

    document.getElementById('loading').style.display = 'flex';

    setTimeout(() => {
        // 해몽 생성 로직 (Seed 기반 조합형으로 수만가지 경우의 수 생성)
        const seed = detail.length + new Date().getSeconds();
        
        let finalType = type;
        // AI 분석 로직 (모르겠음 선택 시)
        if(finalType === "unknown") {
            const luckyWords = ["좋은", "황금", "돈", "빛", "성공", "기쁨"];
            const badWords = ["무서운", "슬픈", "피", "죽음", "도둑"];
            if(luckyWords.some(w => detail.includes(w))) finalType = "lucky";
            else if(badWords.some(w => detail.includes(w))) finalType = "bad";
            else finalType = "predict";
        }

        const mainText = MAIN_DB[finalType][seed % MAIN_DB[finalType].length];
        const subText = SUB_DB[category][seed % SUB_DB[category].length];

        let result = "";
        result += `<b>[총평]</b><br>${mainText}<br><br>`;
        result += `<b>[상징 분석]</b><br>${subText}<br><br>`;
        result += `<b>[조언]</b><br>오늘 하루는 당신의 직감을 믿고 과감하게 결정해 보세요. 꿈의 기운이 당신을 돕고 있습니다.`;

        document.getElementById('res-body').innerHTML = result;

        document.getElementById('loading').style.display = 'none';
        document.getElementById('input-view').style.display = 'none';
        document.getElementById('result-view').style.display = 'block';
        window.scrollTo(0, 0);
    }, 1800);
}
