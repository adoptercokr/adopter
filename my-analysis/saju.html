/* 분석 로직 - 명리학 알고리즘 참고? */
function run() {
    // 1. 입력값 가져오기 및 시간 맵핑 (unknown 처리 포함)
    const uName = document.getElementById('u-name').value;
    const uBirth = document.getElementById('u-birth').value;
    const uGender = document.getElementById('u-gender').value;
    const uHour = document.getElementById('u-hour').value;
    
    // 시간 값을 숫자로 변환 (unknown은 0으로 처리하여 에러 방지)
    const hMap = { "unknown":0, "자":1, "축":2, "인":3, "묘":4, "진":5, "사":6, "오":7, "미":8, "신":9, "유":10, "술":11, "해":12 };

    if (!uName || uBirth.length !== 8) { alert('본인의 정보를 정확히 입력해주세요.'); return; }

    // 2. 알고리즘 시드 생성 (결과 고정용)
    const uNameScore = uName.split('').reduce((a, c) => a + c.charCodeAt(0), 0);
    let finalSeed = parseInt(uBirth) + uNameScore + (hMap[uHour] || 0) + (uGender === 'male' ? 100 : 200);

    let pInfoHtml = "";

    // 3. 애정 궁합 모드일 때 상대방 데이터 처리
    if (currentMode === 'love') {
        const pName = document.getElementById('p-name').value;
        const pBirth = document.getElementById('p-birth').value;
        const pHour = document.getElementById('p-hour').value;

        if (!pName || pBirth.length !== 8) { alert('상대방의 정보를 정확히 입력해주세요.'); return; }

        const pNameScore = pName.split('').reduce((a, c) => a + c.charCodeAt(0), 0);
        finalSeed += (parseInt(pBirth) + pNameScore + (hMap[pHour] || 0));
        pInfoHtml = `<p style="margin:5px 0 0; color:#d32f2f; font-weight:bold;">[상대방] ${pName} / ${pBirth} / ${pHour === 'unknown' ? '시간모름' : pHour + '시'}</p>`;
    }

    document.getElementById('loading').style.display = 'flex';

    setTimeout(() => {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('input-view').style.display = 'none';
        document.getElementById('result-view').style.display = 'block';

        // DB에서 데이터를 가져오는 함수
        const getT = (arr, offset) => arr[(finalSeed * offset) % arr.length];

        let html = `
            <div style="background:#f8f9fa; padding:25px; border-radius:15px; margin-bottom:30px; border:1px solid #eee; text-align:center;">
                <p style="margin:0; font-size:16px;"><b>[본인 명식]</b> ${uName} / ${uBirth} / ${uHour === 'unknown' ? '시간모름' : uHour + '시'}</p>
                ${pInfoHtml}
            </div>
        `;

        // 4. 각 모드에 맞는 결과 출력 (애정 궁합 파트 보강)
        if (currentMode === 'trad') {
            html += `<div class="section-title">✨ 타고난 사주 총평</div>
                     <div class="p-block">${getT(DB.trad.opening, 1)}<br><br>${getT(DB.trad.opening, 2)}</div>
                     <div class="section-title">💰 재물운과 부의 고지</div>
                     <div class="p-block">${getT(DB.trad.wealth, 3)}<br><br>${getT(DB.trad.wealth, 4)}</div>`;
        } else if (currentMode === 'life') {
            html += `<div class="section-title">🏥 건강과 체질 분석</div>
                     <div class="p-block">${getT(DB.life.health, 5)}<br><br>${getT(DB.life.health, 6)}</div>
                     <div class="section-title">🏠 생활 밀착형 팁</div>
                     <div class="p-block">${getT(DB.life.tip, 7)}<br><br>${getT(DB.life.tip, 8)}</div>`;
        } else if (currentMode === 'love') {
            // [수정 완료] 이제 애정 궁합 결과가 정상적으로 출력됩니다.
            html += `<div class="section-title">💘 두 사람의 숙명적 인연</div>
                     <div class="p-block">${getT(DB.love.match, 9)}<br><br>${getT(DB.love.match, 10)}</div>
                     <div class="section-title">⚡ 갈등의 예방과 화합</div>
                     <div class="p-block">${getT(DB.love.conflict, 11)}<br><br>${getT(DB.love.conflict, 12)}</div>
                     <div class="section-title">💍 영원한 사랑을 위한 개운법</div>
                     <div class="p-block">${getT(DB.love.advice, 13)}<br><br>${getT(DB.love.advice, 14)}</div>`;
        }

        document.getElementById('res-header').innerText = `${uName}님의 심층 분석 결과`;
        document.getElementById('res-body').innerHTML = html;
        window.scrollTo(0, 0);
    }, 2000);
}
function render(name) {
    document.getElementById('res-header').innerText = `[${currentMode === 'trad' ? '정통' : currentMode === 'life' ? '생활' : '애정'}] ${name} 님 운명 보고서`;
    const getR = (arr, n) => arr.sort(() => 0.5 - Math.random()).slice(0, n);
    let html = "";

    if(currentMode === 'trad') {
        html += `<div class="section-title">1. 선천적 명식과 기운의 성정</div>`;
        getR(DB.trad.opening, 7).forEach(t => html += `<div class="p-block">${t}</div>`);
        html += `<div class="section-title">2. 평생의 재물 흐름과 부의 고지</div>`;
        getR(DB.trad.wealth, 7).forEach(t => html += `<div class="p-block">${t}</div>`);
        html += `<div class="section-title">3. 인생의 위기를 넘는 대운 개운법</div>`;
        getR(DB.trad.advice, 7).forEach(t => html += `<div class="p-block">${t}</div>`);
    } else if(currentMode === 'life') {
        html += `<div class="section-title">1. 건강과 신체 오행의 균형</div>`;
        getR(DB.life.health, 7).forEach(t => html += `<div class="p-block">${t}</div>`);
        html += `<div class="section-title">2. 일상 속 행운의 파동 분석</div>`;
        getR(DB.life.luck, 7).forEach(t => html += `<div class="p-block">${t}</div>`);
        html += `<div class="section-title">3. 운명을 바꾸는 생활 밀착 팁</div>`;
        getR(DB.life.tip, 7).forEach(t => html += `<div class="p-block">${t}</div>`);
    } else {
        const pName = document.getElementById('p-name').value || "상대방";
        html += `<div class="section-title">1. ${name}님과 ${pName}님의 인연법</div>`;
        getR(DB.love.intro, 7).forEach(t => html += `<div class="p-block">${t}</div>`);
        html += `<div class="section-title">2. 백년해로를 위한 사랑의 비방</div>`;
        getR(DB.love.advice, 7).forEach(t => html += `<div class="p-block">${t}</div>`);
    }
    
    document.getElementById('res-body').innerHTML = html;
    window.scrollTo(0,0);
}
</script>
