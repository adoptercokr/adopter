        /* 광고 배너 */
        .ad-banner { width: 100%; max-width: 500px; background: #fff; margin: 10px auto; display: flex; align-items: center; justify-content: center; border: 1px dashed #ccc; min-height: 80px; font-size: 13px; color: #999; border-radius: 12px; }
        .ad-side { position: fixed; top: 50%; transform: translateY(-50%); width: 120px; height: 500px; background: #fff; border: 1px dashed #ccc; display: flex; align-items: center; justify-content: center; z-index: 10; font-size: 13px; color: #999; border-radius: 12px; }

        @media (max-width: 900px) { .ad-side { display: none; } }

        .container { max-width: 500px; margin: 0 auto; padding: 20px; box-sizing: border-box; }
        .card { background: #fff; border-radius: 24px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); margin-bottom: 20px; }
        
        .header { text-align: center; padding: 30px 0; }
        .header h1 { font-size: 28px; color: var(--main-blue); margin: 0; }
        
        .question-box { min-height: 150px; display: flex; flex-direction: column; justify-content: center; }
        .q-num { color: var(--main-blue); font-weight: bold; font-size: 16px; margin-bottom: 10px; }
        .q-text { font-size: 20px; font-weight: 700; margin-bottom: 25px; }

        .ans-btn { background: #fff; border: 2px solid #edf2f7; width: 100%; padding: 18px; border-radius: 16px; font-size: 17px; cursor: pointer; margin-bottom: 12px; transition: 0.2s; text-align: left; font-family: inherit; }
        .ans-btn:hover { background: var(--sub-blue); border-color: var(--main-blue); }

        #result-view { display: none; text-align: center; }
        .res-mbti { background: var(--main-blue); color: #fff; display: inline-block; padding: 4px 16px; border-radius: 8px; font-size: 24px; font-weight: bold; }
        .res-subtype { font-size: 24px; color: var(--accent); font-weight: 800; margin: 15px 0; }
        .res-desc { text-align: left; font-size: 16px; background: #f8f9fa; padding: 20px; border-radius: 16px; margin: 20px 0; border-left: 4px solid var(--main-blue); }

        .cog-stat { text-align: left; margin-bottom: 20px; }
        .bar-wrap { width: 100%; height: 10px; background: #eee; border-radius: 5px; margin: 5px 0 15px; overflow: hidden; }
        .bar-fill { height: 100%; background: var(--main-blue); width: 0%; transition: 1s ease-out; }

</head>

        "리액션이 좋은 공감 요정", "조직의 화합을 이끄는 리더", "칭찬을 먹고 사는 에너자이저", "전통과 관습을 존중하는 관리자", "남의 불행을 못 보는 따뜻한 영혼"
    ],
    "ENFJ": [
        "혼자만의 시간이 필요한 ENFJ", "사람을 이끄는 따뜻한 리더", "이상을 현실로 만드는 선도자", "타인의 성장을 돕는 멘토", "감수성 풍부한 정의의 사도",
        "말 한마디로 천 냥 빚 갚는 달변가", "사회 문제를 해결하고 싶은 혁신가", "사랑이 넘치는 로맨티스트", "조직의 분위기를 살리는 활력소", "강한 신념을 가진 행동주의자"
    ],
    "ENTJ": [
        "감성 한 스푼 얹은 ENTJ", "거침없는 추진력의 지도자", "미래를 설계하는 전략가", "승부욕이 강한 야심가", "가장 효율적인 목표 달성가",
        "논리적 카리스마의 소유자", "변화를 두려워하지 않는 혁신가", "냉철하지만 공정한 리더", "지적 도전을 즐기는 분석가", "불가능을 가능케 하는 개척자"
    ]
};

let currentIdx = 0;
let results = { EI: 0, SN: 0, TF: 0, JP: 0, TI: 0, FE: 0, SI: 0, NE: 0, EI_SUB: 0 };

function startQuiz() {
    document.getElementById('start-view').classList.add('hide');
    document.getElementById('quiz-view').classList.remove('hide');
    renderQuestion();
}

function renderQuestion() {
    if (currentIdx >= questions.length) {
        showLoading();
        return;
    }
    const q = questions[currentIdx];
    document.getElementById('q-num').innerText = `문항 ${currentIdx + 1} / ${questions.length}`;
    document.getElementById('q-text').innerText = q.q;
    
    const wrap = document.getElementById('ans-wrap');
    wrap.innerHTML = "";
    
    const options = [
        { t: "매우 그렇다", v: 2 },
        { t: "그렇다", v: 1 },
        { t: "그렇지 않다", v: -1 },
        { t: "전혀 아니다", v: -2 }
    ];

    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "ans-btn";
        btn.innerText = opt.t;
        btn.onclick = () => {
            results[q.type] += (opt.v * (q.weight || 1));
            currentIdx++;
            renderQuestion();
        };
        wrap.appendChild(btn);
    });
}

function showLoading() {
    document.getElementById('quiz-view').classList.add('hide');
    document.getElementById('loading-view').style.display = 'block';
    setTimeout(calculateResult, 2000);
}

function calculateResult() {
    let mbti = "";
    mbti += results.EI >= 0 ? "E" : "I";
    mbti += results.SN <= 0 ? "N" : "S";
    mbti += results.TF >= 0 ? "T" : "F";
    mbti += results.JP >= 0 ? "J" : "P";

    // 세부 인덱스 결정 (EI_SUB 값과 인지기능 점수 조합)
    let subIdx = Math.abs(results.EI_SUB % 10);
    if (Math.abs(results.EI) < 3) subIdx = 0; // 경계에 있는 경우 '소심한 E' 등 첫 번째 옵션

    const finalType = subData[mbti][subIdx];

    document.getElementById('loading-view').style.display = 'none';
    document.getElementById('result-view').style.display = 'block';
    
    document.getElementById('res-mbti').innerText = mbti;
    document.getElementById('res-subtype').innerText = finalType;
    document.getElementById('res-desc').innerText = `당신은 전형적인 ${mbti}의 틀을 깨고 자신만의 독특한 인지 기능을 발달시킨 유형입니다. ${finalType}로서의 면모는 당신이 사회적 상황과 개인적 공간에서 어떻게 에너지를 사용하는지를 잘 보여줍니다.`;

    // 인지기능 바 수치화
    const setBar = (id, val) => {
        const p = Math.min(Math.max((val + 10) * 5, 5), 95);
        document.getElementById(id).style.width = p + "%";
    };
    setBar('bar-ti', results.TI);
    setBar('bar-fe', results.FE);
    setBar('bar-si', results.SI);
    setBar('bar-ne', results.NE);
    
    window.scrollTo(0, 0);
}
</script>
