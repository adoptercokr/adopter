    <style>
        :root { --main-green: #27ae60; --accent-yellow: #f1c40f; --text-dark: #2c3e50; --bg-light: #f9f9ff; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg-light); color: var(--text-dark); margin: 0; padding: 0; }

        /* 광고 레이아웃 */
        .ad-full { width: 100%; background: #fff; height: 80px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #888; border: 1px dashed #ccc; box-sizing: border-box; cursor: pointer; }
        .ad-bottom { position: fixed; bottom: 0; z-index: 1000; background: #f1f1f1; }
        .wrapper { display: flex; justify-content: center; min-height: calc(100vh - 160px); }
        .side-ad { flex: 1; display: flex; justify-content: center; padding: 20px; }
        .ad-vertical { width: 160px; height: 600px; background: #fff; border: 1px dashed #ccc; display: flex; align-items: center; justify-content: center; position: sticky; top: 20px; color: #aaa; text-align: center; font-size: 13px; cursor: pointer; }
        @media (max-width: 1100px) { .side-ad { display: none; } }

        .content { width: 100%; max-width: 500px; padding: 40px 20px; box-sizing: border-box; text-align: center; padding-bottom: 120px; }
        
        /* 캡처 영역 */
        #capture-area { background: #fff; border-radius: 25px; padding: 25px; border: 1px solid #eee; box-shadow: 0 8px 20px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        /* 공식 로또 공 색상 */
        .ball { width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; font-weight: 800; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }
        .bg-yellow { background: #fbc02d; } .bg-blue { background: #1976d2; } .bg-red { background: #e53935; } .bg-gray { background: #757575; } .bg-green { background: #43a047; }

        .lotto-display { display: flex; justify-content: center; gap: 8px; margin: 20px 0; min-height: 50px; }
        
        .btn-group { display: flex; gap: 10px; margin-bottom: 10px; }
        .gen-btn { flex: 1; padding: 16px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.2s; }
        .btn-ai { background: var(--main-green); color: white; }
        .btn-win { background: var(--accent-yellow); color: #333; }
        .btn-save { background: #34495e; color: white; width: 100%; margin-top: 5px; }

        /* 생성이력 스타일 (가독성 강화) */
        .history-title { margin: 0 0 15px 0; font-size: 18px; color: #333; font-weight: 800; text-align: center; }
        .history-row { display: flex; justify-content: center; align-items: center; gap: 15px; padding: 12px 0; border-bottom: 1px solid #f2f2f2; }
        .history-label { font-size: 16px; color: #27ae60; font-weight: 800; width: 80px; text-align: center; }
        
        .card { background: #fff; border-radius: 20px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.03); margin-top: 20px; text-align: left; }
        .year-tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #ddd; background: #fff; cursor: pointer; font-size: 12px; font-weight: 800; }
        .tab-btn.active { background: var(--text-dark); color: #fff; border-color: var(--text-dark); }

        .win-list { max-height: 350px; overflow-y: auto; }
        .win-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f2f2f2; }
        .mini-ball { width: 26px; height: 26px; font-size: 12px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 3px; }
    </style>
</head>

    function getColorClass(n) {
        if (n <= 10) return 'bg-yellow'; if (n <= 20) return 'bg-blue';
        if (n <= 30) return 'bg-red'; if (n <= 40) return 'bg-gray';
        return 'bg-green';
    }

    function generate(type) {
        let nums = [];
        let label = type === 'ai' ? 'AI추천' : '1등조합';
        if(type === 'win') {
            const pick = ALL_DATA[Math.floor(Math.random() * ALL_DATA.length)];
            nums = [...pick.num];
        } else {
            while(nums.length < 6) {
                let r = Math.floor(Math.random() * 45) + 1;
                if(!nums.includes(r)) nums.push(r);
            }
            nums.sort((a,b) => a - b);
        }
        document.getElementById('res-view').innerHTML = nums.map(n => `<div class="ball ${getColorClass(n)}">${n}</div>`).join('');
        const hist = document.getElementById('history-list');
        const item = document.createElement('div');
        item.className = 'history-row';
        item.innerHTML = `<span class="history-label">${label}</span><div style="display:flex; gap:6px;">${nums.map(n => `<span class="mini-ball ${getColorClass(n)}">${n}</span>`).join('')}</div>`;
        hist.prepend(item);
        if(hist.children.length > 5) hist.lastChild.remove();
    }

    function loadWinData(mode, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        let displayData = [];
        if(mode === 'recent') displayData = ALL_DATA.slice(0, 13);
        else if(mode === '2025') displayData = ALL_DATA.filter(d => d.date.startsWith('25'));
        else displayData = ALL_DATA.filter(d => d.date.startsWith('24'));

        const display = document.getElementById('win-display');
        display.innerHTML = displayData.map(d => `
            <div class="win-row">
                <span><b>${d.drw}회</b> <small style="color:#999">${d.date}</small></span>
                <div style="display:flex;">${d.num.map(n => `<span class="mini-ball ${getColorClass(n)}">${n}</span>`).join('')}</div>
            </div>
        `).join('');
    }

    function saveAsImage() {
        html2canvas(document.getElementById('capture-area')).then(canvas => {
            const link = document.createElement('a');
            link.download = 'lotto_result_full.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    }
