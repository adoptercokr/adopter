        .header { text-align: center; padding: 30px 0; }
        .header h1 { font-size: 38px; color: var(--main-pink); margin: 0; text-shadow: 2px 2px #fff; }
        .card { background: #fff; border-radius: 30px; padding: 25px; box-shadow: 0 10px 20px rgba(255,143,163,0.1); margin-bottom: 20px; }
        .card-title { font-size: 22px; font-weight: bold; color: var(--main-pink); margin-bottom: 15px; }
        label { display: block; margin: 10px 0 5px; font-size: 16px; font-weight: bold; }
        input, select { width: 100%; padding: 12px; border: 2px solid var(--sub-pink); border-radius: 15px; font-size: 16px; font-family: inherit; box-sizing: border-box; outline: none; }
        .btn-submit { background: var(--main-pink); color: #fff; border: none; width: 100%; padding: 15px; border-radius: 20px; font-size: 22px; font-weight: bold; cursor: pointer; margin-top: 10px; box-shadow: 0 5px 0 #e67e91; }
        #result-view { display: none; text-align: center; animation: fadeIn 0.5s; }
        .score-circle { width: 110px; height: 110px; border-radius: 50%; border: 5px solid var(--main-pink); display: flex; align-items: center; justify-content: center; margin: 15px auto; font-size: 35px; font-weight: bold; color: var(--main-pink); background: #fff; }
        .progress-bar { width: 100%; height: 18px; background: #eee; border-radius: 10px; overflow: hidden; margin: 10px 0; }
        .progress-fill { height: 100%; background: var(--main-pink); width: 0%; transition: 1s ease-out; }
        .result-text { font-size: 17px; line-height: 1.6; padding: 15px; background: #fffafb; border-radius: 15px; margin-top: 10px; text-align: left; }
        #loading { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); z-index: 99; flex-direction: column; align-items: center; justify-content: center; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

function calcMatch() {
    const myName = document.getElementById('my-name').value;
    const myBirth = document.getElementById('my-birth').value;
    const yourName = document.getElementById('your-name').value;
    const yourBirth = document.getElementById('your-birth').value;

    if(!myName || myBirth.length !== 8 || !yourName || yourBirth.length !== 8) {
        alert("이름과 8자리 생년월일을 정확히 입력해주세요! 💖");
        return;
    }

    document.getElementById('loading').style.display = 'flex';

    setTimeout(() => {
        let combinedVal = 0;
        for(let i=0; i<myName.length; i++) combinedVal += myName.charCodeAt(i);
        for(let i=0; i<yourName.length; i++) combinedVal += yourName.charCodeAt(i);
        const seed = combinedVal + parseInt(myBirth.substring(4)) + parseInt(yourBirth.substring(4));

        const totalScore = (seed % 41) + 60; 
        const marryPercent = (seed % 51) + 45; 

        const relText = DB.relation[seed % DB.relation.length];
        const scoreText = DB.scoreDesc[seed % DB.scoreDesc.length];
        const marryText = DB.marryDesc[seed % DB.marryDesc.length];

        document.getElementById('res-title').innerText = `${myName} 💖 ${yourName}`;
        document.getElementById('total-score').innerText = totalScore + "점";
        document.getElementById('marry-percent').innerText = marryPercent + "%";
        document.getElementById('marry-bar').style.width = marryPercent + "%";
        document.getElementById('relation-desc').innerHTML = `<b>인연 분석:</b><br>${relText}`;
        document.getElementById('final-desc').innerHTML = `💬 ${scoreText}<br>💍 ${marryText}`;

        document.getElementById('loading').style.display = 'none';
        document.getElementById('input-view').style.display = 'none';
        document.getElementById('result-view').style.display = 'block';
        window.scrollTo(0, 0);
    }, 1500);
}
