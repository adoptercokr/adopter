<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>희스테이 (HEESTAY) | Jeju Private Poolvilla</title>
  
  <meta name="description" content="제주 성산 온평리 130평 대지 위 40평 2층 단독 풀빌라 희스테이(HEESTAY). 단독 야외 수영장, 노천 온수 자쿠지, 사계절 바베큐 썬룸.">
  
  <link rel="icon" href="data:,">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Noto+Serif+KR:wght@300;400;500;600&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#FFFFFF',
              sand: '#F7F5F0',
              border: '#E8E1D9',
              dark: '#1A1A1A',
              accent: '#8E6E53',
              muted: '#736B63'
            }
          },
          fontFamily: {
            serif: ['Cormorant Garamond', 'Noto Serif KR', 'serif'],
            sans: ['Pretendard', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    html { scroll-behavior: smooth; }
    body { background-color: #FFFFFF; color: #1A1A1A; font-family: 'Pretendard', sans-serif; font-weight: 300; }
    
    .hero-bg {
      background-image: url('https://i.ytimg.com/vi/f09Xfn1fHm8/hqdefault.jpg');
      background-size: cover;
      background-position: center;
      position: relative;
    }
    .hero-overlay {
      background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.6) 100%);
    }

    h1, h2, h3, .font-serif {
      font-family: 'Cormorant Garamond', 'Noto Serif KR', serif;
    }

    /* Calculator White Theme */
    .calc-container { background-color: #FFFFFF; border: 1px solid #E8E1D9; }
    
    .fade-in { opacity: 0; transform: translateY(20px); transition: opacity 0.8s ease-out, transform 0.8s ease-out; }
    .fade-in.visible { opacity: 1; transform: translateY(0); }
  </style>

  <script src="stay_config.js"></script>
</head>
<body class="antialiased">

  <!-- Header -->
  <header class="fixed top-0 w-full z-40 py-4 px-6 md:px-12 bg-white/80 backdrop-blur-md border-b border-brand-border transition-all duration-300">
    <div class="flex justify-between items-center w-full max-w-7xl mx-auto">
      <a href="#" class="text-xl md:text-2xl font-serif tracking-widest text-brand-dark uppercase">
        HEESTAY
      </a>
      <nav class="hidden md:flex space-x-8 text-sm tracking-widest text-brand-muted uppercase font-medium">
        <a href="#benefits" class="hover:text-brand-dark transition">Benefits</a>
        <a href="#gallery" class="hover:text-brand-dark transition">Gallery</a>
        <a href="#booking" class="hover:text-brand-dark transition">Booking</a>
      </nav>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="relative h-screen min-h-[700px] w-full flex items-center justify-center hero-bg">
    <div class="absolute inset-0 hero-overlay"></div>
    <div class="relative z-10 text-center text-white px-4">
      <p id="hero-subtitle" class="text-sm md:text-base font-light tracking-[0.3em] uppercase mb-4 opacity-90"></p>
      <h1 id="hero-title" class="text-4xl md:text-6xl lg:text-7xl font-light tracking-wide leading-tight mb-6"></h1>
      <a href="#gallery" class="inline-block mt-8 px-8 py-3 border border-white/50 text-white text-sm tracking-widest uppercase hover:bg-white hover:text-black transition duration-500">
        Discover
      </a>
    </div>
  </section>

  <!-- Benefits Section (Dynamic) -->
  <section id="benefits" class="py-24 px-6 md:px-12 max-w-7xl mx-auto text-center fade-in">
    <span class="text-xs uppercase tracking-[0.2em] text-brand-accent font-semibold block mb-4">The Privileges</span>
    <h2 class="text-3xl md:text-4xl font-serif text-brand-dark mb-16">Complimentary Offerings</h2>
    <div id="benefits-container" class="grid grid-cols-1 md:grid-cols-3 gap-12">
      <!-- Injected by JS -->
    </div>
  </section>

  <!-- Gallery Section (Dynamic) MUST BE BEFORE BOOKING -->
  <section id="gallery" class="py-24 bg-brand-sand px-6 md:px-12 fade-in">
    <div class="max-w-7xl mx-auto">
      <div class="text-center mb-16">
        <span class="text-xs uppercase tracking-[0.2em] text-brand-accent font-semibold block mb-4">Space Gallery</span>
        <h2 class="text-3xl md:text-4xl font-serif text-brand-dark">Curated Spaces</h2>
      </div>
      <div id="gallery-container" class="flex flex-col gap-24 md:gap-32">
        <!-- Injected by JS -->
      </div>
    </div>
  </section>

  <!-- Booking & Calculator Section -->
  <section id="booking" class="py-24 px-6 md:px-12 max-w-5xl mx-auto fade-in">
    <div class="text-center mb-16">
      <span class="text-xs uppercase tracking-[0.2em] text-brand-accent font-semibold block mb-4">Reservations</span>
      <h2 class="text-3xl md:text-4xl font-serif text-brand-dark">예약 및 견적 확인</h2>
    </div>
    
    <div class="calc-container p-8 md:p-12 shadow-sm rounded-xl">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
        <div>
          <h3 class="text-xl font-serif mb-6 border-b border-brand-border pb-4">Select Dates</h3>
          <div class="bg-gray-50 h-64 rounded flex items-center justify-center text-brand-muted text-sm border border-brand-border">
            [Calendar UI Placeholder]
          </div>
        </div>
        <div>
          <h3 class="text-xl font-serif mb-6 border-b border-brand-border pb-4">요금 산출</h3>
          <div id="rates-container" class="space-y-4 mb-8">
            <!-- Injected by JS -->
          </div>
          <button class="w-full py-4 bg-[#03C75A] text-white font-bold rounded hover:bg-[#02b350] transition">
            네이버 예약하기
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- Facilities & Rules Section (Dynamic) -->
  <section class="py-24 bg-brand-dark text-white px-6 md:px-12 fade-in">
    <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-16">
      <div>
        <h3 class="text-2xl font-serif mb-8 text-brand-sand">Facilities</h3>
        <ul id="facilities-container" class="space-y-4 text-sm font-light text-gray-300">
          <!-- Injected by JS -->
        </ul>
      </div>
      <div>
        <h3 class="text-2xl font-serif mb-8 text-brand-sand">House Rules</h3>
        <ul id="rules-container" class="space-y-4 text-sm font-light text-gray-300">
          <!-- Injected by JS -->
        </ul>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="py-12 text-center text-xs text-brand-muted font-light bg-white border-t border-brand-border">
    <p>&copy; 2026 HEESTAY. All Rights Reserved.</p>
  </footer>

  <script>
    // Smooth reveal on scroll
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.1 });
    
    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));

    // Dynamic Rendering from STAY_CONFIG
    document.addEventListener('DOMContentLoaded', () => {
      // Hero
      document.getElementById('hero-title').innerHTML = STAY_CONFIG.description;
      document.getElementById('hero-subtitle').innerText = STAY_CONFIG.subtitle;

      // Benefits
      const benefitsContainer = document.getElementById('benefits-container');
      STAY_CONFIG.benefits.forEach(benefit => {
        benefitsContainer.innerHTML += `
          <div class="flex flex-col items-center text-center group cursor-default">
            <div class="w-16 h-16 rounded-full border border-brand-border flex items-center justify-center mb-6 text-brand-accent group-hover:scale-110 transition duration-500">
              ${benefit.icon}
            </div>
            <h4 class="text-lg font-serif font-medium mb-3">${benefit.title}</h4>
            <p class="text-sm text-brand-muted leading-relaxed font-light">${benefit.description}</p>
          </div>
        `;
      });

      // Gallery
      const galleryContainer = document.getElementById('gallery-container');
      STAY_CONFIG.spaces.forEach((space, index) => {
        const isEven = index % 2 === 0;
        const layoutClass = isEven ? "md:flex-row" : "md:flex-row-reverse";
        
        galleryContainer.innerHTML += `
          <div class="group cursor-pointer flex flex-col ${layoutClass} items-center gap-8 md:gap-16">
            <div class="w-full md:w-2/3 overflow-hidden aspect-[16/9] shadow-lg">
              <img src="${space.mainImage}" alt="${space.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-1000 ease-in-out">
            </div>
            <div class="w-full md:w-1/3 flex flex-col justify-center text-center md:text-left px-4 md:px-0">
              <span class="text-xs text-brand-muted mb-3 uppercase tracking-[0.2em]">${space.subtitle}</span>
              <h4 class="text-2xl md:text-3xl font-serif text-brand-dark mb-4">${space.title}</h4>
              <div class="w-8 h-[1px] bg-brand-accent mx-auto md:mx-0 mb-6"></div>
              <p class="text-sm text-gray-500 leading-relaxed group-hover:text-gray-900 transition-colors duration-300">
                해당 공간의 디테일한 갤러리 뷰를 감상해보세요. 총 ${space.totalPhotos}장의 사진이 준비되어 있습니다.
              </p>
              <div class="mt-8 text-xs font-semibold text-brand-accent tracking-widest uppercase flex items-center justify-center md:justify-start gap-2 group-hover:gap-4 transition-all duration-300">
                <span>View Gallery</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
              </div>
            </div>
          </div>
        `;
      });

      // Rates
      const ratesContainer = document.getElementById('rates-container');
      ratesContainer.innerHTML = `
        <div class="flex justify-between items-center text-sm pb-2 border-b border-gray-100">
          <span class="text-gray-600">평일 (일~목)</span>
          <span class="font-medium">₩${STAY_CONFIG.rates.weekday}</span>
        </div>
        <div class="flex justify-between items-center text-sm pb-2 border-b border-gray-100">
          <span class="text-gray-600">주말 (금~토)</span>
          <span class="font-medium">₩${STAY_CONFIG.rates.weekend}</span>
        </div>
        <div class="flex justify-between items-center text-sm pb-2 border-b border-gray-100">
          <span class="text-gray-600">성수기</span>
          <span class="font-medium">₩${STAY_CONFIG.rates.peak}</span>
        </div>
      `;

      // Facilities
      const facilitiesContainer = document.getElementById('facilities-container');
      STAY_CONFIG.facilities.forEach(fac => {
        facilitiesContainer.innerHTML += `
          <li class="flex items-center gap-3">
            <span class="w-1.5 h-1.5 bg-brand-accent rounded-full block"></span>
            ${fac.name}
          </li>
        `;
      });

      // Rules
      const rulesContainer = document.getElementById('rules-container');
      STAY_CONFIG.rules.forEach(rule => {
        rulesContainer.innerHTML += `
          <li class="flex items-center gap-3">
            <span class="w-1.5 h-1.5 bg-brand-accent rounded-full block"></span>
            ${rule}
          </li>
        `;
      });
    });
  </script>
</body>
</html>
