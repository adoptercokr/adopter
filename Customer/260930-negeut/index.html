<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="site-title">Premium Stay</title>
  <meta name="description" id="site-desc" content="머묾, 그 자체가 온전한 쉼이 되는 공간">
  <link rel="icon" href="data:,">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Noto+Serif+KR:wght@300;400;500;600&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { bg: '#FFFFFF', sand: '#F9F8F6', border: '#EAE6E1', dark: '#111111', accent: '#A68A64', muted: '#888888' }
          },
          fontFamily: {
            serif: ['Cormorant Garamond', 'Noto Serif KR', 'serif'],
            sans: ['Pretendard', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    html { scroll-behavior: smooth; }
    body { background-color: #FFFFFF; color: #111111; font-family: 'Pretendard', sans-serif; font-weight: 300; line-height: 1.6; }
    .lux-heading { font-family: 'Cormorant Garamond', 'Noto Serif KR', serif; letter-spacing: 0.05em; }
    .fade-up { opacity: 0; transform: translateY(30px); transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1); }
    .fade-up.visible { opacity: 1; transform: translateY(0); }
    .hero-bg { background-size: cover; background-position: center; position: relative; height: 100vh; }
    .hero-overlay { background: linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.5)); position: absolute; inset: 0; }
    
    /* 16:9 Magazine Style Image Containers */
    .img-16-9 { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
    .img-3-4 { width: 100%; aspect-ratio: 3/4; object-fit: cover; }
  </style>
</head>
<body class="antialiased selection:bg-brand-accent selection:text-white">

  <!-- Header -->
  <header class="fixed w-full z-50 transition-all duration-500 bg-transparent text-white border-b border-transparent" id="header">
    <div class="max-w-7xl mx-auto px-6 h-24 flex items-center justify-between">
      <h1 class="lux-heading text-2xl tracking-widest uppercase font-semibold" id="brand-name">STAY</h1>
      <nav class="hidden md:flex space-x-10 text-sm tracking-widest uppercase">
        <a href="#about" class="hover:text-brand-accent transition-colors">About</a>
        <a href="#spaces" class="hover:text-brand-accent transition-colors">Spaces</a>
        <a href="#reservation" class="hover:text-brand-accent transition-colors">Reservation</a>
      </nav>
      <button class="md:hidden">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero-bg flex items-center justify-center text-center" id="hero-section">
    <div class="hero-overlay"></div>
    <div class="relative z-10 text-white px-6 mt-16 fade-up">
      <p class="text-sm tracking-[0.3em] uppercase mb-6" id="hero-subtitle">Premium Private Stay</p>
      <h2 class="lux-heading text-5xl md:text-7xl font-medium mb-8 leading-tight" id="hero-title">STAY</h2>
      <p class="text-lg md:text-xl font-light opacity-90 max-w-2xl mx-auto" id="hero-desc">머묾, 그 자체가 온전한 쉼이 되는 공간</p>
    </div>
  </section>

  <!-- About / Benefits -->
  <section id="about" class="py-32 px-6 bg-brand-sand">
    <div class="max-w-7xl mx-auto">
      <div class="text-center mb-24 fade-up">
        <h3 class="lux-heading text-4xl mb-4">Philosophy</h3>
        <div class="w-10 h-[1px] bg-brand-accent mx-auto"></div>
      </div>
      <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-12" id="benefits-grid">
        <!-- Rendered by JS -->
      </div>
    </div>
  </section>

  <!-- Space Gallery (16:9 alternating layout) -->
  <section id="spaces" class="py-32 bg-brand-bg">
    <div class="max-w-7xl mx-auto px-6 mb-24 text-center fade-up">
      <h3 class="lux-heading text-4xl mb-4">Space Gallery</h3>
      <div class="w-10 h-[1px] bg-brand-accent mx-auto"></div>
    </div>
    
    <div id="spaces-container" class="flex flex-col gap-32">
      <!-- Rendered by JS -->
    </div>
  </section>

  <!-- Facilities & Rules -->
  <section class="py-32 bg-brand-sand border-t border-brand-border">
    <div class="max-w-7xl mx-auto px-6 grid md:grid-cols-2 gap-24 fade-up">
      <div>
        <h3 class="lux-heading text-3xl mb-12">Facilities</h3>
        <div class="grid grid-cols-2 gap-6 text-brand-muted" id="facilities-grid">
          <!-- Rendered by JS -->
        </div>
      </div>
      <div>
        <h3 class="lux-heading text-3xl mb-12">Information & Rules</h3>
        <ul class="space-y-4 text-brand-muted font-light" id="rules-list">
          <!-- Rendered by JS -->
        </ul>
      </div>
    </div>
  </section>

  <!-- Reservation (Calendar & Calculator UI per MJ rules) -->
  <section id="reservation" class="py-32 px-6 bg-white">
    <div class="max-w-4xl mx-auto">
      <div class="text-center mb-16 fade-up">
        <h3 class="lux-heading text-4xl mb-4">예약 및 견적 확인</h3>
        <div class="w-10 h-[1px] bg-brand-accent mx-auto mb-8"></div>
        <p class="text-brand-muted">원하시는 날짜를 선택하시면 예상 요금을 확인하실 수 있습니다.</p>
      </div>

      <div class="bg-white border border-brand-border p-8 md:p-12 fade-up shadow-sm">
        <div class="mb-8">
          <label class="block text-sm font-medium mb-3 text-brand-dark">체크인 - 체크아웃</label>
          <input type="text" placeholder="날짜 선택" class="w-full p-4 border border-brand-border focus:border-brand-accent focus:ring-0 outline-none text-center text-lg bg-brand-sand" readonly>
        </div>
        
        <div class="border-t border-brand-border pt-8 mb-8" id="quote-area">
          <div class="flex justify-between items-center mb-4 text-lg">
            <span>객실 요금</span>
            <span class="font-medium" id="calc-price">₩0</span>
          </div>
          <div class="flex justify-between items-center text-xl font-medium mt-6 pt-6 border-t border-brand-border">
            <span>총 예상 결제 금액</span>
            <span class="text-2xl text-brand-accent" id="total-price">₩0</span>
          </div>
        </div>

        <button class="w-full bg-[#03C75A] text-white py-5 text-lg font-medium hover:bg-[#02b351] transition-colors flex items-center justify-center gap-2">
          네이버 예약하기
        </button>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-brand-dark text-white py-20 px-6">
    <div class="max-w-7xl mx-auto text-center md:text-left grid md:grid-cols-2 gap-12 opacity-80">
      <div>
        <h2 class="lux-heading text-2xl mb-6 uppercase" id="footer-brand">STAY</h2>
        <p class="font-light text-sm text-gray-400">Premium Private Stay</p>
      </div>
      <div class="md:text-right font-light text-sm text-gray-400 space-y-2">
        <p>사업자등록번호: 준비중</p>
        <p>Copyright © <span id="footer-year">2024</span>. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="./stay_config.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if(typeof STAY_CONFIG === 'undefined') return;
      const c = STAY_CONFIG;
      
      // Basic Info
      document.title = c.name + " | Premium Stay";
      document.getElementById('site-title').innerText = c.name + " | Premium Stay";
      document.getElementById('site-desc').content = c.description;
      document.getElementById('brand-name').innerText = c.name;
      document.getElementById('hero-title').innerText = c.name;
      document.getElementById('hero-subtitle').innerText = c.subtitle || 'Premium Private Stay';
      document.getElementById('hero-desc').innerText = c.description;
      document.getElementById('footer-brand').innerText = c.name;
      document.getElementById('footer-year').innerText = new Date().getFullYear();
      
      // Hero Image
      if(c.spaces && c.spaces.length > 0) {
        document.getElementById('hero-section').style.backgroundImage = url('');
      }

      // Benefits
      const bGrid = document.getElementById('benefits-grid');
      if(c.benefits && c.benefits.length > 0) {
        c.benefits.forEach((b, idx) => {
          bGrid.innerHTML += 
            <div class="fade-up text-center" style="transition-delay: ms">
              <div class="w-16 h-16 mx-auto mb-6 flex items-center justify-center text-brand-accent bg-white rounded-full shadow-sm">
                
              </div>
              <h4 class="text-xl mb-3 font-medium"></h4>
              <p class="text-brand-muted text-sm font-light leading-relaxed"></p>
            </div>
          ;
        });
      } else {
        document.getElementById('about').style.display = 'none';
      }

      // Space Gallery (Alternating Magazine Style)
      const sCont = document.getElementById('spaces-container');
      if(c.spaces && c.spaces.length > 0) {
        c.spaces.forEach((s, i) => {
          const isReverse = i % 2 !== 0;
          let imagesHtml = '';
          if(s.images && s.images.length > 0) {
             imagesHtml = s.images.slice(0, 3).map(img => <img src="" class="img-16-9 mb-4" alt="">).join('');
          }
          sCont.innerHTML += 
            <div class="flex flex-col  gap-12 items-center fade-up px-6 md:px-0">
              <div class="w-full md:w-1/2">
                <img src="" class="img-3-4" alt="">
              </div>
              <div class="w-full md:w-1/2 px-0 md:px-12 text-center ">
                <p class="lux-heading text-brand-accent text-xl mb-2 tracking-widest uppercase"></p>
                <h4 class="text-4xl font-medium mb-8"></h4>
                <div class="space-y-4">
                  
                </div>
              </div>
            </div>
          ;
        });
      }

      // Facilities
      const fGrid = document.getElementById('facilities-grid');
      if(c.facilities && c.facilities.length > 0) {
        c.facilities.forEach(f => {
          fGrid.innerHTML += <div class="flex items-center gap-3"><span class="w-1 h-1 bg-brand-accent rounded-full"></span></div>;
        });
      }

      // Rules
      const rList = document.getElementById('rules-list');
      if(c.rules && c.rules.length > 0) {
        c.rules.forEach(r => {
          rList.innerHTML += <li class="flex gap-3"><span class="text-brand-accent mt-1">✔</span><span></span></li>;
        });
      }

      // Scroll Animation Observer
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
          }
        });
      }, { threshold: 0.1 });
      document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
      
      // Header Scroll Effect
      window.addEventListener('scroll', () => {
        const header = document.getElementById('header');
        if (window.scrollY > 50) {
          header.classList.add('bg-white', 'text-brand-dark', 'border-brand-border', 'shadow-sm');
          header.classList.remove('bg-transparent', 'text-white', 'border-transparent');
        } else {
          header.classList.remove('bg-white', 'text-brand-dark', 'border-brand-border', 'shadow-sm');
          header.classList.add('bg-transparent', 'text-white', 'border-transparent');
        }
      });
    });
  </script>
</body>
</html>
